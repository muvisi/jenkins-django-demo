---
- name: Deploy Django application
  hosts: django_servers
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/jenkins-django-demo
    app_user: deploy
    app_service: jenkins-django-demo

  tasks:
    - name: Install Python dependencies
      ansible.builtin.apt:
        name:
          - python3.12
          - python3.12-venv
          - python3-pip
        state: present
        update_cache: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Copy Django application
      ansible.builtin.unarchive:
        src: "{{ playbook_dir }}/../django-release.tar.gz"
        dest: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"

    - name: Create virtual environment
      ansible.builtin.command:
        cmd: python3.12 -m venv "{{ app_dir }}/venv"
        creates: "{{ app_dir }}/venv/bin/python"

    - name: Install requirements
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"

    - name: Check Django environment file
      ansible.builtin.stat:
        path: /etc/jenkins-django-demo.env
      register: django_env

    - name: Create production environment file
      ansible.builtin.shell: |
        python3 - <<'PY'
        import secrets
        from pathlib import Path
        secret = secrets.token_urlsafe(64)
        Path("/etc/jenkins-django-demo.env").write_text(
            f"DJANGO_SECRET_KEY={secret}\n"
            "DJANGO_DEBUG=False\n"
            "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1\n"
        )
        PY
      when: not django_env.stat.exists
      no_log: true

    - name: Secure environment file
      ansible.builtin.file:
        path: /etc/jenkins-django-demo.env
        owner: root
        group: deploy
        mode: '0640'

    - name: Configure Django allowed hosts
      ansible.builtin.lineinfile:
        path: /etc/jenkins-django-demo.env
        regexp: '^DJANGO_ALLOWED_HOSTS='
        line: 'DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,66.23.236.42'
        owner: root
        group: deploy
        mode: '0640'

    - name: Run database migrations
      ansible.builtin.shell: |
        set -a
        . /etc/jenkins-django-demo.env
        set +a
        ./venv/bin/python manage.py migrate --noinput
      args:
        chdir: "{{ app_dir }}"
        executable: /bin/bash
      become_user: deploy
      no_log: true

    - name: Install Gunicorn service
      ansible.builtin.template:
        src: templates/gunicorn.service.j2
        dest: /etc/systemd/system/jenkins-django-demo.service
        owner: root
        group: root
        mode: '0644'

    - name: Start Django service
      ansible.builtin.systemd_service:
        name: "{{ app_service }}"
        daemon_reload: true
        enabled: true
        state: restarted

    - name: Verify Django health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8001/health/
        status_code: 200
        return_content: true
      register: health_result
      retries: 10
      delay: 3
      until: health_result.status == 200

    - name: Display deployment result
      ansible.builtin.debug:
        msg: "Django deployment successful"
