---
- name: Configure Nginx for Django
  hosts: django_servers
  become: true
  gather_facts: false

  tasks:
    - name: Check for conflicting default Nginx servers
      ansible.builtin.shell: |
        nginx -T 2>&1 | awk '
          /^# configuration file / { file=$0 }
          /^[[:space:]]*listen .*default_server/ {
            if (index(file, "jenkins-django-demo") == 0) {
              print file ": " $0
            }
          }
        '
      register: conflicting_defaults
      changed_when: false

    - name: Stop if another default server exists
      ansible.builtin.assert:
        that:
          - conflicting_defaults.stdout | trim == ''
        fail_msg: "Another Nginx default server exists. No changes made."

    - name: Install Django Nginx configuration
      ansible.builtin.template:
        src: templates/nginx-ip.conf.j2
        dest: /etc/nginx/sites-available/jenkins-django-demo
        owner: root
        group: root
        mode: '0644'

    - name: Enable Django Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/jenkins-django-demo
        dest: /etc/nginx/sites-enabled/jenkins-django-demo
        state: link

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload Nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

    - name: Verify public Django endpoint
      ansible.builtin.uri:
        url: http://66.23.236.42/health/
        status_code: 200
      register: health_result
      retries: 5
      delay: 3
      until: health_result.status == 200
