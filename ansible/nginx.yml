---
- name: Configure Nginx for Django
  hosts: django_servers
  become: true
  gather_facts: false

  tasks:
    - name: Create Let's Encrypt challenge directory
      ansible.builtin.file:
        path: /var/www/letsencrypt/.well-known/acme-challenge
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Check SSL certificate
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/demo.nachat.co.ke/fullchain.pem
        follow: true
      register: ssl_certificate

    - name: Check SSL private key
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/demo.nachat.co.ke/privkey.pem
        follow: true
      register: ssl_private_key

    - name: Set SSL status
      ansible.builtin.set_fact:
        ssl_certificate_exists: >-
          {{ ssl_certificate.stat.exists and ssl_private_key.stat.exists }}

    - name: Install Django Nginx configuration
      ansible.builtin.template:
        src: templates/nginx-ip.conf.j2
        dest: /etc/nginx/sites-available/jenkins-django-demo
        owner: root
        group: root
        mode: '0644'
        backup: true

    - name: Enable Django Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/jenkins-django-demo
        dest: /etc/nginx/sites-enabled/jenkins-django-demo
        state: link

    - name: Validate Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Reload Nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

    - name: Verify public IP endpoint
      ansible.builtin.uri:
        url: http://66.23.236.42/health/
        status_code: 200
      register: health_result
      retries: 5
      delay: 3
      until: health_result.status == 200
