---
- name: Install and configure SSL certificate
  hosts: django_servers
  become: true
  gather_facts: false

  vars:
    django_domain: demo.nachat.co.ke
    letsencrypt_email: mwangangimuvisi@gmail.com

  tasks:
    - name: Install Certbot
      ansible.builtin.apt:
        name:
          - certbot
        state: present
        update_cache: true

    - name: Create Let's Encrypt challenge directory
      ansible.builtin.file:
        path: /var/www/letsencrypt/.well-known/acme-challenge
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Check domain challenge endpoint
      ansible.builtin.uri:
        url: "http://{{ django_domain }}/.well-known/acme-challenge/"
        status_code:
          - 200
          - 403
          - 404
      register: challenge_check

    - name: Obtain or renew Let's Encrypt certificate
      ansible.builtin.command:
        argv:
          - certbot
          - certonly
          - --webroot
          - -w
          - /var/www/letsencrypt
          - -d
          - "{{ django_domain }}"
          - --email
          - "{{ letsencrypt_email }}"
          - --agree-tos
          - --non-interactive
          - --keep-until-expiring
      register: certbot_result
      changed_when: "'Certificate not yet due for renewal' not in (certbot_result.stdout | default(''))"

    - name: Verify SSL certificate
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ django_domain }}/fullchain.pem"
        follow: true
      register: certificate

    - name: Fail if certificate was not installed
      ansible.builtin.assert:
        that:
          - certificate.stat.exists
        fail_msg: "SSL certificate installation failed."

    - name: Enable automatic SSL renewal
      ansible.builtin.systemd_service:
        name: certbot.timer
        enabled: true
        state: started

    - name: Install Nginx reload hook after certificate renewal
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        content: |
          #!/bin/sh
          set -eu
          nginx -t
          systemctl reload nginx
        owner: root
        group: root
        mode: '0755'

    - name: Display SSL installation result
      ansible.builtin.debug:
        msg: "SSL certificate installed for {{ django_domain }}"
